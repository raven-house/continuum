version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: continuum-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${CONTINUUM_DB_NAME:-continuum}
    volumes:
      - mongodb_data:/data/db
      - ./database/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - continuum-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
    name: continuum_mongodb_data
  indexer_logs:
    name: continuum_indexer_logs

networks:
  continuum-network:
    name: continuum-network
    driver: bridge
