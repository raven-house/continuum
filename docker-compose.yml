# Local Development Docker Compose
# Default configuration used when running `docker compose up -d`.
# Services mount source code for hot reloading and use development commands.

services:
  mongodb:
    image: mongo:7
    container_name: continuum-mongodb-local
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: continuum
    volumes:
      - mongodb_data_local:/data/db
      - ./database/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - continuum-network-local
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  indexer:
    build:
      context: .
      dockerfile: indexer/Dockerfile
    container_name: continuum-indexer-local
    working_dir: /app
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      CONTINUUM_DB_CONNECTION_STRING: mongodb://root:password@mongodb:27017
      CONTINUUM_DB_NAME: continuum
      CONTINUUM_INDEXER_INTERVAL: ${CONTINUUM_INDEXER_INTERVAL:-30000}
      CONTINUUM_INDEXER_BLOCK_RANGE: ${CONTINUUM_INDEXER_BLOCK_RANGE:-14}
      CONTINUUM_INDEXER_MAX_RETRIES: ${CONTINUUM_INDEXER_MAX_RETRIES:-3}
      AZTEC_NETWORK: ${AZTEC_NETWORK:-sandbox}
      CONTINUUM_AZTEC_NODE_URL_TESTNET: ${CONTINUUM_AZTEC_NODE_URL_TESTNET:-https://v5.testnet.rpc.aztec-labs.com}
      CONTINUUM_AZTEC_NODE_URL_SANDBOX: ${CONTINUUM_AZTEC_NODE_URL_SANDBOX:-http://host.docker.internal:8080}
      NODE_ENV: development
    volumes:
      - ./indexer:/app
      - /app/node_modules
    networks:
      - continuum-network-local
    command: ["bun", "run", "start"]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: continuum-api-local
    working_dir: /app
    ports:
      - "3004:3004"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      CONTINUUM_DB_CONNECTION_STRING: mongodb://root:password@mongodb:27017
      CONTINUUM_DB_NAME: continuum
      RD_PORT: 3004
      RD_HOST: 0.0.0.0
      CONTINUUM_API_PORT: 3004
      CONTINUUM_API_HOST: 0.0.0.0
      CONTINUUM_CORS_ORIGIN: "*"
      NODE_ENV: development
    volumes:
      - ./api:/app
      - /app/node_modules
    networks:
      - continuum-network-local
    command: ["bun", "run", "dev"]

volumes:
  mongodb_data_local:
    name: continuum_mongodb_data_local

networks:
  continuum-network-local:
    name: continuum-network-local
    driver: bridge
